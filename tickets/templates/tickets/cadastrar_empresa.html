{% extends 'tickets/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white text-center py-3">
                <h4 class="mb-0 fw-bold">Cadastro de Empresa</h4>
                <p class="text-muted small mb-0">Crie sua conta para solicitar suporte técnico</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Cadastrar Empresa</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <span class="text-muted">Já possui uma conta?</span>
                <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Fazer Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
