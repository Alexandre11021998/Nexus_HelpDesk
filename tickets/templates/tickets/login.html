{% extends 'tickets/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white text-center py-3">
                <h4 class="mb-0 fw-bold">NexusHelp Login</h4>
                <p class="text-muted small mb-0">Acesse o portal de suporte</p>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuário ou senha inválidos. Tente novamente.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" placeholder="Seu nome de usuário" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Entrar</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <span class="text-muted">Sua empresa ainda não tem cadastro?</span>
                <a href="{% url 'cadastrar_empresa' %}" class="fw-bold text-decoration-none">Cadastre-se</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
